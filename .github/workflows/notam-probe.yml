name: NOTAM CN Probe

on:
  workflow_dispatch:
    inputs:
      env:
        description: "NMS-API environment"
        required: true
        default: "staging"
        type: choice
        options:
          - prod
          - staging
          - fit

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run probe
        env:
          NMS_CLIENT_ID: ${{ secrets.NMS_CLIENT_ID }}
          NMS_CLIENT_SECRET: ${{ secrets.NMS_CLIENT_SECRET }}
          NMS_ENV: ${{ github.event.inputs.env }}
        run: python notam_cn_probe.py

      - name: Preview cn_sample.json (debug, temporary)
        run: python -c "import json; d=json.load(open('probe_out/cn_sample.json')); print(f'{len(d)} records'); print(json.dumps(d[:2], ensure_ascii=False, indent=2))"

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: notam-probe-output
          path: probe_out/
          retention-days: 7
